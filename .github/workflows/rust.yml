name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./polyfish-rs

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./polyfish-rs -> target"

      - name: Build
        run: cargo build --no-default-features --verbose

      - name: Run tests
        run: cargo test --no-default-features --lib --tests --bin self_play --verbose

      # Called out separately from the suite above: this is the Rust<->Python
      # width parity check, and a failure here means model.safetensors will not
      # round-trip between self_play and train.py.
      - name: Rust/Python width parity
        run: cargo test --no-default-features --test parity_widths -- --nocapture

  # Every long flag run_training_loop.sh passes must actually parse. Nothing
  # else checks this seam, and three broken flags shipped undetected.
  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./polyfish-rs -> target"

      - name: Build the binaries the shell drivers call
        working-directory: ./polyfish-rs
        run: cargo build --no-default-features --bin self_play --bin arena --bin polyfish --bin actor_ceiling

      - name: Check shell -> binary CLI contract
        working-directory: ./polyfish-rs
        run: python3 scripts/check_cli_contract.py --no-build

  # The Python half of the pipeline: ladder.py owns every strength verdict and
  # train.py is the trainer the loop actually runs. Neither had a test before
  # (audit T3). Runs twice on purpose - bare python3 first, so the suite is
  # proven to work on a box with no torch, then with the pinned wheel so the
  # torch-dependent cases (holdout split, spatial padding, D4) actually execute.
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./polyfish-rs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Suite without torch (torch-dependent cases skip)
        run: ./scripts/run_python_tests.sh

      - name: Install pinned Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          TORCH=$(sed -n 's/^# POLYFISH_TORCH_VERSION=//p' requirements.txt)
          .venv/bin/pip install "torch==$TORCH" --index-url https://download.pytorch.org/whl/cpu

      - name: Full suite
        run: ./scripts/run_python_tests.sh

  # The Rust<->Python forward parity the audit calls the highest-value missing
  # test in the repo: load one model.safetensors into network.rs (candle CPU)
  # and train.py (PyTorch CPU) and compare raw logits. This is what caught the
  # strided cross-attention bug, which every other check passed straight
  # through. Needs both toolchains, hence its own job.
  forward-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./polyfish-rs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./polyfish-rs -> target"
          key: forward-parity

      - name: Install pinned Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          TORCH=$(sed -n 's/^# POLYFISH_TORCH_VERSION=//p' requirements.txt)
          .venv/bin/pip install "torch==$TORCH" --index-url https://download.pytorch.org/whl/cpu

      - name: candle CPU vs PyTorch CPU
        run: ./scripts/run_forward_parity.sh

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./polyfish-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./polyfish-rs -> target"

      # BLOCKING, and now with no carve-outs: the correctness group used to be
      # globally -A'd for absurd_extreme_comparisons and never_loop, which meant
      # a new violation anywhere in the tree was admitted silently. The seven
      # sites that fired are now scoped allows at the exact statement, each with
      # its reason (five dead opening-temperature branches, two loops-as-blocks).
      - name: Clippy (correctness)
        run: cargo clippy --no-default-features --all-targets -- -D clippy::correctness

      # NON-BLOCKING. Measured 2026-08-18: 395 warnings across lib + tests, of
      # which 241 are collapsible_if (the edition-2024 let-chain suggestion) and
      # 24 each are map_or / field_reassign_with_default. Turn this into
      # `-D warnings` once that backlog is cleared; gating on it today would
      # fail every PR on day one.
      - name: Clippy (full report, advisory)
        continue-on-error: true
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      # NON-BLOCKING. Measured 2026-08-18: 47 of ~200 source files are
      # unformatted (178 diff hunks), so this reports drift instead of gating.
      # Run `cargo fmt` across the tree, then drop continue-on-error.
      - name: cargo fmt (advisory)
        continue-on-error: true
        run: cargo fmt --check

      - name: Python syntax
        working-directory: .
        run: python3 -m compileall -q -x '(^|/)(target|\.venv|node_modules|__pycache__)($|/)' .

  # Compile-check each inference backend. Honest status:
  #   no-default-features (candle CPU) - really checked, on every run.
  #   metal / accelerate / metal-eval  - macOS only, advisory: these have never
  #                                      run in CI before, so a first failure is
  #                                      a CI bug to fix, not a merge blocker.
  #   metal-eval+tch-eval              - macOS only, advisory, compile only. It
  #                                      exists because metal_parity/metal_bench
  #                                      carry required-features on BOTH (see
  #                                      Cargo.toml), so --all-targets silently
  #                                      skipped them on every single-feature row
  #                                      and metal_parity had never compiled here.
  #   tch-eval                         - macOS only, advisory: needs a pinned
  #                                      PyTorch 2.12 from pip plus the bypass
  #                                      env vars in Cargo.toml. This row also
  #                                      RUNS tch_parity (candle-CPU vs tch-CPU),
  #                                      the first execution of a non-candle
  #                                      backend anywhere in CI; its MPS half
  #                                      self-skips when has_mps() is false.
  #   cuda / cudnn                     - NOT checked anywhere. No hosted runner
  #                                      here has nvcc; wiring one up needs a
  #                                      CUDA toolkit action or a self-hosted
  #                                      box. Do not assume they compile.
  backends:
    name: backend (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candle-cpu
            os: ubuntu-latest
            features: ""
            advisory: false
          - label: candle-metal
            os: macos-latest
            features: "metal"
            advisory: true
          - label: accelerate
            os: macos-latest
            features: "accelerate"
            advisory: true
          - label: metal-eval
            os: macos-latest
            features: "metal-eval"
            advisory: true
          - label: tch-eval
            os: macos-latest
            features: "tch-eval"
            advisory: true
          - label: metal-eval+tch-eval
            os: macos-latest
            features: "metal-eval,tch-eval"
            advisory: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./polyfish-rs -> target"
          key: ${{ matrix.label }}

      # Guarded on the feature, not the label, so the combined row links too.
      # requirements.txt comes along because init_model.py needs safetensors.
      - name: Install PyTorch for tch-eval
        if: contains(matrix.features, 'tch-eval')
        working-directory: ./polyfish-rs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          TORCH=$(sed -n 's/^# POLYFISH_TORCH_VERSION=//p' requirements.txt)
          .venv/bin/pip install "torch==$TORCH"

      - name: Compile-check
        working-directory: ./polyfish-rs
        env:
          LIBTORCH_USE_PYTORCH: 1
          LIBTORCH_BYPASS_VERSION_CHECK: 1
        run: |
          if [ -d .venv/bin ]; then PATH="$(pwd)/.venv/bin:$PATH"; export PATH; fi
          if [ -z "${{ matrix.features }}" ]; then
            cargo check --no-default-features --all-targets
          else
            cargo check --no-default-features --features "${{ matrix.features }}" --all-targets
          fi

      # tch_parity has only ever been compile-checked, so this is its first
      # execution anywhere in CI: a failure on dyld linkage is a CI bug, a
      # failure on a numeric delta is a real parity finding. Only the plain
      # tch-eval row runs it - the combined row stays a pure compile check.
      # Debug build on purpose: the release profile is lto="fat" and the example
      # is eight forward passes.
      - name: tch parity (advisory)
        if: matrix.label == 'tch-eval'
        continue-on-error: true
        working-directory: ./polyfish-rs
        env:
          LIBTORCH_USE_PYTORCH: 1
          LIBTORCH_BYPASS_VERSION_CHECK: 1
        run: |
          export PATH="$(pwd)/.venv/bin:$PATH"
          # The tch-linked binary has no rpath for libtorch (run_training_loop.sh:93).
          TORCH_LIB=$(.venv/bin/python3 -c 'import torch, os; print(os.path.join(os.path.dirname(torch.__file__), "lib"))')
          export DYLD_LIBRARY_PATH="$TORCH_LIB${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          # tch_parity hardcodes the relative path model.safetensors, and
          # init_model.py imports train.py off the cwd, so both need this dir.
          .venv/bin/python3 init_model.py
          cargo run --no-default-features --features tch-eval --example tch_parity
